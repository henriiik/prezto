import = ["~/.config/alacritty/themes/themes/alabaster_dark.toml"]

[font]
size = 14
normal = { family = "Inconsolata Nerd Font", style = "Regular" }
bold = { family = "Inconsolata Nerd Font", style = "Regular" }
italic = { family = "Inconsolata Nerd Font", style = "Regular" }
bold_italic = { family = "Inconsolata Nerd Font", style = "Regular" }

[window]
option_as_alt = "Both"

[colors]
draw_bold_text_with_bright_colors = true

[keyboard]
bindings = [{ key = "Right", mods = "Alt", chars = "\u001Bf" }, { key = "Left", mods = "Alt", chars = "\u001Bb" }]
